<!DOCTYPE html>
<html xmls:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Login</title>
    </head>
    <body>
        <!-- Navigaation Bar -->
         <nav>
            <a href="/">Home</a>
            <a href="/">Login</a>
            <a href="/">Register</a>
         </nav>

         <h1>User Login</h1>

         <!-- Error Message (displays when login fails) -->
          <div th:if="${param.error}" style="color: red; background-color: #ffcccc; padding:
          10px; margin: 10px 0;">
          Invalid username or password.
          </div>

        <!-- Success Message (displays after registration) -->
         <div th:if="${param.registered}" style="color: green; background-color: #ccffcc;
         padding: 10px; margin: 10px 0;">
         Registration successful! Please login.
            </div>

        <!-- Login Form -->
         <form th:action="@{/login}" method="post">
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required />
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required />
            </div>

            <div>
                <button type="submit">Login</button>
            </div>
         </form>

         <p>Don't have an account? <a href="/register">Register here</a></p>
    </body>
</html>
