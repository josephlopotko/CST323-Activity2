<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirm Delete User</title>
</head>
<body>
    <!-- Navigation Bar (Admin view) -->
    <nav>
        <a href="/">Home</a>
        <a href="/admin/users">User Admin</a>
        <a href="/logout">Logout</a>
    </nav>

    <h1>Confirm Delete User</h1>

    <!-- Warning Message -->
    <div style="color: red; background-color: #ffcccc; padding: 15px; margin: 15px 0; border: 2px solid red;">
        <strong>⚠️ WARNING!</strong><br/>
        Are you sure you want to delete this user account?
    </div>

    <!-- User Details -->
    <div th:object="${user}">
        <h3>User Details:</h3>
        <p><strong>Username:</strong> <span th:text="*{username}">john</span></p>
        <p><strong>Role:</strong> <span th:text="*{role}">USER</span></p>
        <p><strong>Status:</strong> <span th:text="*{enabled ? 'Enabled' : 'Disabled'}">Enabled</span></p>
    </div>

    <div style="background-color: #fff3cd; padding: 10px; margin: 10px 0;">
        This action cannot be undone.
    </div>

    <!-- Delete Form -->
    <form th:action="@{/admin/users/delete}" method="post">
        <input type="hidden" name="id" th:value="${user.id}" />
        <button type="submit" style="background-color: red; color: white; padding: 10px 20px;">Confirm Delete</button>
        <a href="/admin/users" style="padding: 10px 20px; background-color: gray; color: white; text-decoration: none;">Cancel</a>
    </form>
</body>
</html>
